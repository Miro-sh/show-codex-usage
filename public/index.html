<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Quota</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <section class="card" aria-live="polite">
        <div class="gauge" role="img" aria-label="Quota restant">
          <svg class="gauge-arc" viewBox="0 0 240 240" aria-hidden="true">
            <circle class="gauge-track" cx="120" cy="120" r="100" pathLength="100" />
            <circle id="gauge-fill" class="gauge-fill" cx="120" cy="120" r="100" pathLength="100" />
          </svg>
          <div class="reading"><strong id="remaining">—</strong></div>
        </div>
        <aside class="reset-requests" aria-live="polite">
          <span>Dernier reset</span>
          <strong id="last-reset-date">—</strong>
          <span id="last-reset-ago">—</span>
        </aside>
        <div class="details">
          <dl>
            <div><dt id="primary-label">Limite principale</dt><dd id="reset">—</dd></div>
            <div id="secondary-row"><dt id="secondary-label">Limite secondaire</dt><dd id="weekly">—</dd></div>
          </dl>
        </div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
